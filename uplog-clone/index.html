<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HighMD · 让创作更高效，让表达更简单</title>
<style>
:root{--bg:#f6f6f6;--panel:#fff;--panel-2:#fbf3e8;--border:#ececec;--bs:#d8d8d8;--text:#1a1a1a;--t2:#555;--t3:#999;--radius:8px;--rl:12px;--s1:0 1px 2px rgba(0,0,0,.04);--s2:0 4px 16px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}input,textarea{font:inherit;color:inherit;outline:none}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand .mark{width:30px;height:30px;background:#0F766E;color:#fff;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:-.5px}
.brand .name{font-size:16px;letter-spacing:-.2px}
.brand .name span{font-weight:400;opacity:.5;font-size:12px;margin-left:1px}
.nav-group{display:flex;align-items:center;gap:8px;margin-left:18px}
.nav-btn{height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);border:1px solid var(--border);background:#fff;transition:all .15s;white-space:nowrap}
.nav-btn:hover{color:var(--text);border-color:var(--bs)}
.nav-btn.primary{background:#0F766E;color:#fff;border-color:#0F766E}
.nav-btn.primary:hover{background:#129E91}
.nav-btn svg{width:14px;height:14px}
.topbar .spacer{flex:1}
.right-nav{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--t2)}
.right-nav a{transition:color .15s}
.right-nav a:hover{color:var(--text)}
.right-nav .invite{color:#e62e3f;display:inline-flex;align-items:center;gap:4px}
.vip-btn{height:32px;padding:0 14px;background:linear-gradient(95deg,#22C7B4 0%,#0F766E 100%);color:#fff;font-weight:600;border-radius:8px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(255,138,61,.3);font-size:13px}
.vip-btn:hover{filter:brightness(1.05)}
.login-link{font-weight:500;color:var(--text)}
.workspace{display:grid;grid-template-columns:78px 1fr 1fr 320px;height:calc(100vh - 56px)}
.pages-bar{background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:10px;overflow-y:auto}
.page-thumb{width:58px;height:78px;border:1.5px dashed var(--bs);border-radius:4px;background:#fff;display:grid;place-items:center;font-size:9px;color:var(--t3);cursor:pointer;position:relative;padding:6px 4px;text-align:center;line-height:1.2;transition:all .15s;flex-shrink:0;overflow:hidden;word-break:break-all}
.page-thumb:hover{border-color:#999}
.page-thumb.active{border:1.5px solid #0F766E;border-style:solid}
.page-thumb.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:#0F766E;border-radius:0 0 3px 3px}
.page-add{width:56px;height:56px;border:1px solid var(--border);border-radius:6px;display:grid;place-items:center;color:var(--t3);transition:all .15s;flex-shrink:0}
.page-add:hover{color:var(--text);border-color:var(--bs);background:#fafafa}
.pages-bar .spacer{flex:1}
.collapse-btn{font-size:12px;color:var(--t3);display:inline-flex;align-items:center;gap:4px;padding:8px 12px;flex-shrink:0}
.collapse-btn:hover{color:var(--text)}
.editor{background:var(--bg);padding:20px 28px 28px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.editor-card{background:#fff;border-radius:var(--rl);padding:18px 22px;box-shadow:var(--s1)}
.field-label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px}
.field-label .label-info{color:var(--t3);font-weight:400;font-size:12px}
.title-input{width:100%;height:42px;padding:0 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;transition:border-color .15s;background:#fff}
.title-input:focus{border-color:#0F766E}
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap}
.tb-btn{height:30px;min-width:30px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--t2);font-size:13px;font-weight:500;transition:all .15s}
.tb-btn:hover{background:#f3f3f3;color:var(--text)}
.tb-btn.active{background:#0F766E;color:#fff}
.tb-btn svg{width:15px;height:15px}
.tb-sep{width:1px;height:16px;background:var(--border);margin:0 6px;align-self:center}
.tb-spacer{flex:1}
.tb-action{font-size:12px;color:var(--t2);display:inline-flex;align-items:center;gap:4px;padding:0 8px;height:30px;border-radius:6px;transition:all .15s}
.tb-action:hover{color:var(--text);background:#f3f3f3}
.tb-action svg{width:13px;height:13px}
.editor-area{min-height:260px;padding:6px 4px;font-size:15px;line-height:1.85;color:var(--t2);outline:none}
.editor-area:empty::before{content:"创作从这里开始";color:#c5c5c5}
.editor-area h1{font-size:22px;font-weight:700;color:var(--text);margin:12px 0 6px}
.editor-area h2{font-size:18px;font-weight:700;color:var(--text);margin:10px 0 4px}
.editor-area h3{font-size:16px;font-weight:600;color:var(--text);margin:8px 0 4px}
.toggle{width:32px;height:18px;background:#0F766E;border-radius:999px;position:relative;cursor:pointer;transition:background .15s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:2px;left:16px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.off{background:#d8d8d8}
.toggle.off::after{left:2px}
.import-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.import-card{background:#fff;border:1px solid var(--border);border-radius:var(--rl);padding:18px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;transition:all .15s;cursor:pointer}
.import-card:hover{border-color:#0F766E;transform:translateY(-1px);box-shadow:var(--s1)}
.import-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
.import-icon svg{width:18px;height:18px}
.import-icon.wechat{background:#07c160}
.import-icon.feishu{background:#3370ff}
.import-icon.notion{background:#000}
.import-icon.upload{background:#f3f3f3;color:var(--t2);border:1px dashed var(--bs)}
.import-card span{font-size:12px;color:var(--t2)}
.preview{background:var(--bg);padding:20px 24px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow-y:auto}
.preview-header{width:100%;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--t2)}
.preview-header .left{display:flex;align-items:center;gap:6px}
.preview-header .name{color:var(--text);font-weight:600}
.ratio-group{display:flex;gap:4px;background:#ececec;border-radius:7px;padding:2px}
.ratio-btn{height:24px;min-width:34px;padding:0 8px;border-radius:5px;font-size:12px;color:var(--t2);font-weight:500;transition:all .15s}
.ratio-btn:hover{color:var(--text)}
.ratio-btn.active{background:#0F766E;color:#fff}
.preview-frame{width:100%;max-width:340px;aspect-ratio:3 / 5;border:1.5px dashed #b8b8b8;border-radius:10px;background:#fff;position:relative;overflow:hidden;transition:aspect-ratio .25s}
.preview-frame.r-3-4{aspect-ratio:3 / 4}
.preview-stage{position:absolute;inset:6px;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;padding:28px 22px 22px;font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;transition:background .25s,color .25s}
.page-indicator{font-size:12px;color:var(--t3)}
.tpl-default{background:#fff;color:#0F766E}
.tpl-mint{background:#d8eed6;color:#1a4d2a}
.tpl-peach{background:#fde0d0;color:#6b3220}
.tpl-cream{background:#fdf3e1;color:#5c3a1f}
.tpl-dark{background:#0F766E;color:#f5f5f5}
.tpl-lavender{background:#e8e2f5;color:#3a2d5e}
.tpl-sky{background:#d8ecf7;color:#1a3a55}
.tpl-pink{background:#fbd9e2;color:#6b1f3a}
.tpl-rose{background:#f5d4cc;color:#5a2218}
.tpl-amber{background:#ffe6b3;color:#4d3208}
.tpl-coffee{background:#efe2d2;color:#4a2f1c}
.tpl-card{--title-size:21px;--body-size:12.5px;--title-font:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--body-font:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--body-align:left;--line-height:1.8;--p-mt:0px;--p-mb:0px;--p-pl:0px;--p-pr:0px;--p-indent:0px;--p-spacing:0px;position:relative;height:100%;display:flex;flex-direction:column}
.tpl-card .stars{position:absolute;top:0;right:0;font-size:12px;opacity:.35;letter-spacing:2px}
.tpl-card .badge{font-size:10px;padding:2px 7px;border-radius:3px;display:inline-block;align-self:flex-start;margin-bottom:12px;background:rgba(0,0,0,.08);font-weight:600;letter-spacing:.5px}
.tpl-card h1{font-size:var(--title-size);line-height:1.4;font-weight:800;margin-bottom:12px;letter-spacing:-.3px;font-family:var(--title-font);text-align:var(--body-align)}
.tpl-card .body{font-size:var(--body-size);line-height:var(--line-height);opacity:.88;flex:1;overflow:hidden;font-family:var(--body-font);text-align:var(--body-align);letter-spacing:var(--p-spacing)}
.tpl-card .body p{margin:var(--p-mt) 0 var(--p-mb) 0;padding-left:var(--p-pl);padding-right:var(--p-pr);text-indent:var(--p-indent)}
.tpl-card .body h1,.tpl-card .body h2,.tpl-card .body h3{font-size:inherit;line-height:inherit;margin:0 0 4px 0;font-weight:700}
.tpl-card .footer{font-size:10px;opacity:.4;margin-top:10px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid currentColor;padding-top:8px}
.template-lib{background:var(--panel-2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.lib-tabs{display:flex;align-items:center;gap:28px;padding:18px 20px 14px;font-size:15px;border-bottom:1px solid rgba(0,0,0,.04);background:#fdf6ec}
.lib-tab{position:relative;font-weight:600;color:var(--t3);cursor:pointer;padding-bottom:6px;transition:color .15s}
.lib-tab:hover{color:var(--t2)}
.lib-tab.active{color:var(--text)}
.lib-tab.active::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:18px;height:2px;background:#0F766E;border-radius:2px}
.lib-content{flex:1;overflow-y:auto;padding:14px 14px 24px}
.tpl-section{margin-bottom:18px}
.tpl-section h4{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;padding:0 4px}
.vip-tag{background:#0F766E;color:#ffd57a;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.5px}
.tpl-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl-mini{aspect-ratio:3 / 4;border-radius:4px;border:1px solid rgba(0,0,0,.06);padding:7px 5px;overflow:hidden;cursor:pointer;transition:all .15s;position:relative;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.tpl-mini:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.tpl-mini.active{box-shadow:0 0 0 2px #0F766E}
.tpl-mini .mini-title{font-weight:700;font-size:7px;margin-bottom:3px;line-height:1.3}
.tpl-mini .mini-bar{height:1.2px;background:currentColor;opacity:.25;margin:2px 0}
.tpl-mini .mini-footer{position:absolute;bottom:4px;left:5px;right:5px;font-size:5px;opacity:.5;display:flex;justify-content:space-between}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F766E;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.2);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.adj-panel{padding:12px 8px}
.adj-card{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:8px;padding:14px;margin-bottom:12px}
.adj-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px;color:var(--t2)}
.adj-row:last-child{margin-bottom:0}
.adj-row input[type=range]{width:55%;accent-color:#0F766E}
.adj-row select{padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;background:#fff}
.adj-row .color-swatch{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);cursor:pointer}
@media (max-width:1280px){.workspace{grid-template-columns:70px 1fr 1fr 280px}.editor{padding:20px 20px 24px}.preview{padding:20px 18px 24px}}
@media (max-width:1024px){.workspace{grid-template-columns:70px 1fr 280px}.preview{display:none}}
@media (max-width:720px){.workspace{grid-template-columns:60px 1fr}.template-lib{display:none}.nav-group{gap:4px}.right-nav{gap:10px;font-size:12px}}
.lib-content::-webkit-scrollbar,.editor::-webkit-scrollbar,.preview::-webkit-scrollbar,.pages-bar::-webkit-scrollbar{width:6px}
.lib-content::-webkit-scrollbar-thumb,.editor::-webkit-scrollbar-thumb,.preview::-webkit-scrollbar-thumb,.pages-bar::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:3px}

/* === Adjust panel (UPlog-style) === */
.adj-panel{padding:4px 4px 24px}
.adj-tabs{display:flex;background:#efe6d8;border-radius:8px;padding:3px;gap:2px;margin-bottom:12px}
.adj-tab{flex:1;text-align:center;font-size:12.5px;padding:7px 4px;border-radius:6px;color:var(--t2);cursor:pointer;transition:all .15s;font-weight:500;white-space:nowrap}
.adj-tab:hover:not(.active){color:var(--text)}
.adj-tab.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
.adj-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.adj-mini-card{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:8px;padding:11px 10px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;position:relative;transition:all .15s}
.adj-mini-card:hover{border-color:rgba(0,0,0,.18)}
.adj-mini-card.active{box-shadow:inset 0 -2px 0 #0F766E;border-color:rgba(15,118,110,.35)}
.adj-mini-card.vip-disabled{opacity:.7;cursor:not-allowed}
.adj-mini-card .adj-mini-icon{color:#0F766E;font-size:16px;font-weight:700;width:16px;display:inline-flex;align-items:center;justify-content:center}
.adj-mini-card .vip-tag{margin-left:auto;background:#111;color:#ffd57a;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;letter-spacing:.5px}
.adj-mini-card .adj-mini-icon svg{width:14px;height:14px}
.adj-section{margin-bottom:14px}
.adj-section-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text);min-height:24px}
.adj-section-head>span:first-child{font-weight:600}
.adj-reset{margin-left:auto;font-size:12px;color:var(--t3);display:inline-flex;align-items:center;gap:3px;background:none;border:0;cursor:pointer;font-weight:400}
.adj-reset:hover{color:#0F766E}
.adj-link{font-size:12px;color:var(--t2);display:inline-flex;align-items:center;gap:3px;background:none;border:0;cursor:pointer;font-weight:400}
.adj-link:hover{color:#0F766E}
.adj-section-head .vip-tag.inline{background:#111;color:#ffd57a;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.5px}
.adj-section-head .bg-actions{margin-left:auto;display:flex;gap:10px}
.adj-block{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.adj-block:last-child{margin-bottom:0}
.adj-field-label{font-size:12.5px;color:var(--t2);margin:6px 0 6px;font-weight:500}
.adj-field-label:first-child{margin-top:0}
.size-group{display:flex;background:#f1ede7;border-radius:6px;padding:2px;margin-bottom:8px}
.size-btn{flex:1;font-size:12px;padding:6px 2px;border-radius:4px;color:var(--t2);font-weight:500;transition:all .15s}
.size-btn:hover{color:var(--text)}
.size-btn.active{background:#0F766E;color:#fff}
.font-select-wrap{position:relative}
.font-select{width:100%;padding:8px 30px 8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;appearance:none;-webkit-appearance:none;cursor:pointer;color:var(--text);font-family:inherit}
.font-select:focus{outline:none;border-color:#0F766E}
.font-select-wrap::after{content:"\25BE";position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--t2);font-size:11px}
.align-group{display:flex;background:#f1ede7;border-radius:6px;padding:2px;flex:1;gap:0}
.align-btn{flex:1;display:flex;align-items:center;justify-content:center;padding:7px;border-radius:4px;color:var(--t2);transition:all .15s;background:transparent}
.align-btn:hover{color:var(--text)}
.align-btn.active{background:#FFC53D;color:#111}
.align-btn svg{width:16px;height:16px}
.num-stepper{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:6px;padding:0 4px 0 8px;flex:1;height:32px;gap:6px;min-width:0}
.num-stepper .step-icon{color:var(--t2);font-size:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:16px;line-height:1}
.num-stepper input{flex:1;border:0;text-align:right;font-size:13px;font-weight:500;min-width:0;width:100%;background:transparent;color:var(--text);padding:0;-moz-appearance:textfield;font-family:inherit}
.num-stepper input::-webkit-outer-spin-button,.num-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-stepper input:focus{outline:none}
.step-arrows{display:flex;flex-direction:column;border-left:1px solid var(--border);padding-left:3px;flex-shrink:0}
.step-up,.step-down{width:14px;height:13px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:8px;line-height:1;background:transparent}
.step-up:hover,.step-down:hover{color:#0F766E}
.adj-row-flex{display:flex;gap:8px;margin-bottom:8px}
.adj-row-flex:last-child{margin-bottom:0}
.bg-upload{background:linear-gradient(180deg,#2c3a4a 0%,#1c2735 100%);border-radius:8px;height:100px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.06)}
.bg-upload::before{content:"";position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.04) 25%,transparent 25%);background-size:18px 18px}
.bg-upload-btn{background:rgba(255,255,255,.96);color:var(--text);font-size:13px;font-weight:500;padding:8px 18px;border-radius:6px;z-index:1;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.bg-upload-btn:hover{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}

</style>
</head>
<body><header class="topbar">
  <div class="brand"><div class="mark">H</div><div class="name">HighMD</div></div>
  <div class="nav-group">
    <button class="nav-btn" data-act="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>新建笔记</button>

        };
        card.style.setProperty(prop, fontMap[sel.value] || fontMap['\u5e73\u65b9']);
      });
    });

    $$('.align-group').forEach(group => {
      group.querySelectorAll('.align-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          card.style.setProperty('--body-align', btn.dataset.align);
          group.querySelectorAll('.align-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    });

    const propMap = {
      lineHeight:'--line-height', marginTop:'--p-mt', marginBottom:'--p-mb',
      paddingLeft:'--p-pl', paddingRight:'--p-pr', textIndent:'--p-indent',
      lineSpacing:'--p-spacing'
    };
    $$('.num-stepper').forEach(stepper => {
      const target = stepper.dataset.target;
      const prop = propMap[target];
      const input = stepper.querySelector('input');
      const decimals = (input.step && input.step.includes('.')) ? input.step.split('.')[1].length : 0;
      const apply = () => {
        const v = parseFloat(input.value);
        if (isNaN(v)) return;
        let suffix = 'px';
        if (target === 'lineHeight') suffix = '';
        card.style.setProperty(prop, v + suffix);
      };
      const setVal = (v) => {
        const f = Math.pow(10, decimals);
        input.value = String(Math.round(v * f) / f);
        apply();
      };
      input.addEventListener('input', apply);
      input.addEventListener('blur', () => { if (decimals > 0) setVal(parseFloat(input.value) || 0); });
      stepper.querySelector('.step-up').addEventListener('click', () => {
        const step = parseFloat(input.step) || 1;
        setVal((parseFloat(input.value) || 0) + step);
      });
      stepper.querySelector('.step-down').addEventListener('click', () => {
        const step = parseFloat(input.step) || 1;
        setVal((parseFloat(input.value) || 0) - step);
      });
    });

    $$('.adj-reset').forEach(btn => {
      btn.addEventListener('click', () => {
        const kind = btn.dataset.reset;
        if (kind === 'text') {
          ['--title-size','--body-size','--title-font','--body-font'].forEach(p => card.style.removeProperty(p));
          $$('.size-btn').forEach(b => b.classList.remove('active'));
          $$('.size-btn[data-size="sm"]').forEach(b => b.classList.add('active'));
          $$('.font-select').forEach(s => s.selectedIndex = 0);
          showToast('文字已恢复默认');
        } else if (kind === 'spacing') {
          ['--body-align','--line-height','--p-mt','--p-mb','--p-pl','--p-pr','--p-indent','--p-spacing'].forEach(p => card.style.removeProperty(p));
          $$('.align-btn').forEach(b => b.classList.remove('active'));
          $$('.align-btn[data-align="left"]').forEach(b => b.classList.add('active'));
          const defaults = { lineHeight:'1.8', marginTop:0, marginBottom:0, paddingLeft:0, paddingRight:0, textIndent:0, lineSpacing:0 };
          $$('.num-stepper').forEach(s => { const t = s.dataset.target; if (defaults[t] !== undefined) s.querySelector('input').value = defaults[t]; });
          showToast('间距已恢复默认');
        }
      });
    });

    $$('.adj-tab').forEach(t => {
      t.addEventListener('click', () => {
        $$('.adj-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        if (t.dataset.scope === 'global') showToast('已切换到全局卡片属性');
      });
    });

    $$('.adj-mini-card').forEach(c => {
      c.addEventListener('click', () => {
        if (c.classList.contains('vip-disabled')) { showToast('\u6837\u5f0f\u6a21\u7248\u9700\u5f00\u901a VIP'); return; }
        $$('.adj-mini-card').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
      });
    });

    const cropBtn = libContent.querySelector('[data-act="crop"]');
    if (cropBtn) cropBtn.addEventListener('click', () => showToast('\u8bf7\u5148\u4e0a\u4f20\u56fe\u7247\u518d\u88c1\u526a'));
    const resetBgBtn = libContent.querySelector('[data-act="resetbg"]');
    if (resetBgBtn) resetBgBtn.addEventListener('click', () => {
      stage.style.backgroundImage = '';
      stage.style.backgroundSize = '';
      stage.style.backgroundPosition = '';
      showToast('\u5df2\u6062\u590d\u9ed8\u8ba4\u80cc\u666f');
    });

    const bgBtn = $('#bgUploadBtn');
    const bgInput = $('#bgFileInput');
    if (bgBtn && bgInput) {
      bgBtn.addEventListener('click', () => bgInput.click());
      bgInput.addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => {
          stage.style.backgroundImage = 'url(' + ev.target.result + ')';
          stage.style.backgroundSize = 'cover';
          stage.style.backgroundPosition = 'center';
          showToast('\u5df2\u66ff\u6362\u80cc\u666f');
        };
        r.readAsDataURL(f);
        e.target.value = '';
      });
    }
  }
  function applyTemplate(id,cls,name){
    state.currentTpl=id;state.tplName=name;tplNameEl.textContent=name;previewStage.className='preview-stage '+cls;prevBadge.textContent=(name.indexOf('日签')>-1?'日签 · DAY 06':name.indexOf('咖啡')>-1?'一杯咖啡 · 慢度时光':name.indexOf('智启')>-1?'智启 · 新时代':'HighMD · 灵感笔记');$$('.tpl-mini').forEach(m=>m.classList.remove('active'));const t=document.querySelector('.tpl-mini[data-tpl="'+id+'"]');if(t)t.classList.add('active');
  }
  renderLibrary();applyTemplate('tpl-default','tpl-default','简单格子');
  libContent.addEventListener('click',e=>{const t=e.target.closest('.tpl-mini');if(!t)return;applyTemplate(t.dataset.tpl,t.dataset.cls,t.dataset.section);showToast('已应用：'+t.title);});
  $$('.lib-tab').forEach(t=>t.addEventListener('click',()=>{$$('.lib-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');if(t.dataset.tab==='adj')renderAdjust();else renderLibrary();}));
  titleInput.addEventListener('input',()=>{state.pages[state.currentPage].title=titleInput.value;prevTitle.textContent=titleInput.value||'HighMD：把想法装进卡片，让表达更精炼';updateThumb();});
  editorArea.addEventListener('input',()=>{state.pages[state.currentPage].html=editorArea.innerHTML;prevBody.innerHTML=editorArea.innerHTML;});
  $('#titleToggle').addEventListener('click',e=>{state.showTitle=!state.showTitle;e.currentTarget.classList.toggle('off',!state.showTitle);prevTitle.style.display=state.showTitle?'':'none';});
  $('#pageToggle').addEventListener('click',e=>{state.autoPage=!state.autoPage;e.currentTarget.classList.toggle('off',!state.autoPage);showToast(state.autoPage?'已开启自动分页':'已关闭自动分页');});
  $$('.ratio-btn').forEach(btn=>btn.addEventListener('click',()=>{$$('.ratio-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.ratio=btn.dataset.ratio;previewFrame.classList.toggle('r-3-4',state.ratio==='3-4');}));
  $$('.tb-btn[data-cmd]').forEach(btn=>btn.addEventListener('mousedown',e=>{e.preventDefault();document.execCommand('formatBlock',false,btn.dataset.cmd.toUpperCase());editorArea.dispatchEvent(new Event('input'));}));
  $('#emojiBtn').addEventListener('click',()=>{const em=['😊','✨','🎉','💡','📌','🚀','🌈','☕','🌸','🔥','👍','💪','🌟','🍀','🎯','✏️'];const c=em[Math.floor(Math.random()*em.length)];document.execCommand('insertText',false,c);editorArea.dispatchEvent(new Event('input'));});
  $('#imgBtn').addEventListener('click',()=>$('#fileInput').click());
  $('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.type.startsWith('image/')){const r=new FileReader();r.onload=ev=>{const img='<img src="'+ev.target.result+'" style="max-width:100%;border-radius:6px;margin:6px 0;">';document.execCommand('insertHTML',false,img);editorArea.dispatchEvent(new Event('input'));showToast('已插入图片');};r.readAsDataURL(f);}else{const r=new FileReader();r.onload=ev=>{editorArea.innerHTML='<p>'+(ev.target.result||'').replace(/\n/g,'</p><p>')+'</p>';editorArea.dispatchEvent(new Event('input'));showToast('已导入 '+f.name);};r.readAsText(f);}e.target.value='';});
  $('#markBtn').addEventListener('click',()=>{document.execCommand('hiliteColor',false,'#fff3a3');showToast('已开启荧光笔');});
  $('#downloadBtn').addEventListener('click',exportPNG);
  $('#undoBtn').addEventListener('click',()=>{document.execCommand('undo');editorArea.dispatchEvent(new Event('input'));});
  $('#redoBtn').addEventListener('click',()=>{document.execCommand('redo');editorArea.dispatchEvent(new Event('input'));});
  function renderPages(){const add=$('#addPage');pagesBar.innerHTML='';state.pages.forEach((p,i)=>{const t=document.createElement('div');t.className='page-thumb'+(i===state.currentPage?' active':'');t.dataset.page=i;const txt=(p.title||('未命名 '+(i+1))).slice(0,14);t.innerHTML='<span>'+txt.replace(/[\r\n]/g,'<br>')+'</span>';t.addEventListener('click',()=>{state.currentPage=i;refreshPage();renderPages();});pagesBar.appendChild(t);});pagesBar.appendChild(add);const sp=document.createElement('div');sp.className='spacer';sp.style.flex='1';pagesBar.appendChild(sp);const col=document.createElement('button');col.className='collapse-btn';col.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg> 收起';pagesBar.appendChild(col);}
  function updateThumb(){const t=pagesBar.querySelector('.page-thumb[data-page="'+state.currentPage+'"]');if(t){const tx=state.pages[state.currentPage].title||'未命名';t.innerHTML='<span>'+tx.slice(0,14).replace(/[\r\n]/g,'<br>')+'</span>';}}
  function refreshPage(){const p=state.pages[state.currentPage];titleInput.value=p.title;editorArea.innerHTML=p.html||'';prevTitle.textContent=p.title||'HighMD：把想法装进卡片，让表达更精炼';prevBody.innerHTML=p.html||'';prevTitle.style.display=state.showTitle?'':'none';}
  $('#addPage').addEventListener('click',()=>{state.pages.push({title:'新页面 '+(state.pages.length+1),html:''});state.currentPage=state.pages.length-1;refreshPage();renderPages();showToast('已添加新页面');});
  $$('.import-card').forEach(c=>c.addEventListener('click',()=>{const t=c.querySelector('span').textContent;if(c.dataset.import==='local'){$('#fileInput').click();}else{showToast('正在连接：'+t);setTimeout(()=>showToast('已打开 '+t+' 导入面板'),800);}}));
  $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>{const t=b.textContent.trim();if(t.indexOf('发布')>-1){exportPNG();setTimeout(()=>showToast('已生成卡片 PNG'),100);}else{showToast('功能：'+t);}}));
  $$('.right-nav a, .vip-btn').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();if(a.classList.contains('vip-btn'))showToast('跳转 VIP 开通页');else showToast('打开：'+a.textContent.trim());}));
  $$('.tb-action').forEach(a=>a.addEventListener('click',()=>{if(a.dataset.act==='check')showToast('已扫描，未发现违规内容');else if(a.dataset.act==='layout'){const lines=(editorArea.innerText||'').split(/\n+/).filter(Boolean);if(lines.length>1){editorArea.innerHTML=lines.map(l=>l.length>30?'<h2>'+l+'</h2><p>':'<p>'+l+'</p>').join('');editorArea.dispatchEvent(new Event('input'));showToast('已应用智能排版');}else{showToast('正文较短，无需排版');}}}));
  function exportPNG(){const node=$('#previewFrame');const w=node.offsetWidth,h=node.offsetHeight,scale=2;const canvas=document.createElement('canvas');canvas.width=w*scale;canvas.height=h*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);const stage=node.querySelector('.preview-stage');const bg=getComputedStyle(stage).backgroundColor;ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.fillStyle=getComputedStyle(stage).color;ctx.textBaseline='top';const padL=22,padR=22,padT=28,innerW=w-padL-padR;const titleEl=stage.querySelector('h1');const bodyEl=stage.querySelector('.body');const badgeEl=stage.querySelector('.badge');const footerEl=stage.querySelector('.footer');const family=getComputedStyle(stage).fontFamily;let y=padT;if(badgeEl){ctx.font='600 10px '+family;const txt=badgeEl.textContent;const tw=ctx.measureText(txt).width+14;ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(padL,y,tw,16);ctx.fillStyle=getComputedStyle(stage).color;ctx.fillText(txt,padL+7,y+3);y+=28;}if(titleEl){ctx.font='800 21px '+family;wrapText(ctx,titleEl.textContent,innerW).forEach(line=>{ctx.fillText(line,padL,y);y+=28;});y+=8;}if(bodyEl){ctx.font='12.5px '+family;const bodyLines=wrapText(ctx,bodyEl.innerText||'',innerW);const maxLines=Math.floor((h-y-30)/22);bodyLines.slice(0,maxLines).forEach(line=>{ctx.fillText(line,padL,y);y+=22;});}if(footerEl){ctx.font='10px '+family;ctx.fillStyle='rgba(0,0,0,0.4)';const footText=(footerEl.textContent||'').replace(/\s+/g,' ').trim();const fparts=footText.split(/\s+/);ctx.fillText(fparts[0]||'',padL,h-22);if(fparts.length>1){const last=fparts[fparts.length-1];ctx.fillText(last,w-padR-ctx.measureText(last).width,h-22);}}const link=document.createElement('a');link.download='HighMD-'+Date.now()+'.png';link.href=canvas.toDataURL('image/png');link.click();}
  function wrapText(ctx,text,maxWidth){const out=[];(text||'').split(/\n/).forEach(line=>{if(!line.trim()){out.push('');return;}let cur='';for(const ch of line){if(ctx.measureText(cur+ch).width>maxWidth&&cur){out.push(cur);cur=ch;}else{cur+=ch;}}if(cur)out.push(cur);});return out;}
  let toastTimer;function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);}
  renderPages();prevTitle.textContent=state.pages[0].title;prevBadge.textContent='HighMD · 灵感笔记';
})();
</script>
