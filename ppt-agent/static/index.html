<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>PPT生成器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #1E3A5F;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        select, textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        select:focus, textarea:focus, input:focus {
            outline: none;
            border-color: #667EEA;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .info {
            color: #666;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PPT 生成器</h1>
        <form id="pptForm">
            <div class="form-group">
                <label for="scene">使用场景</label>
                <select id="scene" name="scene" required>
                    <option value="投融资汇报">投融资汇报</option>
                    <option value="内部培训">内部培训</option>
                    <option value="产品介绍">产品介绍</option>
                </select>
            </div>
            <div class="form-group">
                <label for="keywords">关键词</label>
                <input type="text" id="keywords" name="keywords" placeholder="例如：AI驱动、内容生成、智能营销" required>
            </div>
            <div class="form-group">
                <label for="background">背景信息</label>
                <textarea id="background" name="background" placeholder="描述一下项目背景、目标受众、核心信息..." required></textarea>
            </div>
            <button type="submit" id="submitBtn">生成PPT</button>
        </form>
        <div class="result" id="result"></div>
    </div>

    <script>
        document.getElementById('pptForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const result = document.getElementById('result');

            btn.disabled = true;
            btn.textContent = '生成中...';
            result.className = 'result';
            result.style.display = 'none';

            try {
                const formData = {
                    keywords: document.getElementById('keywords').value,
                    background: document.getElementById('background').value,
                    scene: document.getElementById('scene').value
                };

                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    // 下载PPTX文件
                    const link = document.createElement('a');
                    link.href = 'data:application/vnd.openxmlformats-officedocument.presentationml.presentation;base64,' + data.output;
                    link.download = 'ppt_' + Date.now() + '.pptx';
                    link.click();

                    result.className = 'result success';
                    result.textContent = `生成成功！共 ${data.slides} 页，风格：${data.style}`;
                } else {
                    result.className = 'result error';
                    result.textContent = data.detail || '生成失败';
                }
            } catch (err) {
                result.className = 'result error';
                result.textContent = '请求失败：' + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '生成PPT';
            }
        });
    </script>
</body>
</html>
